<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Pro - SAP Business One Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none; } }
        /* Ajuste para que la previsualización no se vea gigante en laptops */
        #pdf-preview { transform-origin: top center; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <div class="w-full lg:w-1/2 p-6 bg-white shadow-xl no-print overflow-y-auto">
            <h2 class="text-2xl font-bold text-blue-800 mb-6 border-b pb-2">Datos de la Cotización</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cliente</label>
                    <select id="cliente" class="w-full p-2 border rounded-md bg-gray-50 focus:ring-2 focus:ring-blue-500" onchange="updatePreview()">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Vendedor</label>
                    <select id="vendedor" class="w-full p-2 border rounded-md bg-gray-50" onchange="updatePreview()">
                        <option value="">Cargando vendedores...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Moneda</label>
                    <select id="moneda" class="w-full p-2 border rounded-md bg-gray-50" onchange="calculateTotals()">
                        <option value="PEN">Soles (S/)</option>
                        <option value="USD">Dólares ($)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Condición de Pago</label>
                    <select id="condicion" class="w-full p-2 border rounded-md bg-gray-50" onchange="updatePreview()">
                        <option value="">Cargando condiciones...</option>
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-semibold text-gray-800">Líneas de Detalle</h3>
                    <button onclick="addRow()" class="bg-green-600 text-white px-3 py-1 rounded-md text-sm hover:bg-green-700">+ Agregar Ítem</button>
                </div>
                <div id="items-container" class="space-y-2">
                    </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-100">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="aplicaDetraccion" onchange="calculateTotals()">
                    <label for="aplicaDetraccion" class="font-medium text-blue-800 text-sm">¿Aplica Detracción?</label>
                </div>
                <select id="tipoDetraccion" class="w-full mt-2 p-2 border rounded-md text-sm" onchange="calculateTotals()">
                    </select>
            </div>

            <button onclick="guardarCotizacion()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-blue-800 transition">
                GUARDAR Y SINCRONIZAR
            </button>
        </div>

        <div class="w-full lg:w-1/2 p-10 bg-gray-200 flex justify-center overflow-auto">
            <div id="pdf-preview" class="bg-white w-[210mm] min-h-[297mm] p-12 shadow-2xl scale-[0.6] lg:scale-[0.85] xl:scale-100">
                <div class="flex justify-between border-b-2 border-blue-800 pb-4 mb-6">
                    <div>
                        <h1 class="text-3xl font-black text-blue-900">COTIZACIÓN</h1>
                        <p class="text-gray-500 font-mono">Nro: <span id="view-nro">COT-2026-XXX</span></p>
                    </div>
                    <div class="text-right text-sm">
                        <p class="font-bold">MI NEGOCIO ERP S.A.C.</p>
                        <p>Lima, Perú</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8 mb-8 text-sm">
                    <div>
                        <p class="text-gray-400 uppercase font-bold text-[10px]">Cliente</p>
                        <p id="view-cliente" class="font-bold text-gray-800">-</p>
                        <p id="view-ruc" class="text-gray-600">-</p>
                    </div>
                    <div class="text-right">
                        <p class="text-gray-400 uppercase font-bold text-[10px]">Fecha Emisión</p>
                        <p id="view-fecha" class="text-gray-800">-</p>
                        <p class="text-gray-400 uppercase font-bold text-[10px] mt-2">Vendedor</p>
                        <p id="view-vendedor" class="text-gray-800">-</p>
                    </div>
                </div>

                <table class="w-full text-left text-sm mb-8">
                    <thead>
                        <tr class="bg-blue-900 text-white">
                            <th class="p-2">Descripción</th>
                            <th class="p-2 text-center">Cant.</th>
                            <th class="p-2 text-right">Precio</th>
                            <th class="p-2 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="view-items"></tbody>
                </table>

                <div class="flex justify-end">
                    <div class="w-64 space-y-2 text-sm border-t-2 border-gray-100 pt-4">
                        <div class="flex justify-between text-gray-600"><span>Subtotal:</span> <span id="view-subtotal">0.00</span></div>
                        <div class="flex justify-between text-gray-600"><span>IGV (18%):</span> <span id="view-igv">0.00</span></div>
                        <div class="flex justify-between border-t border-gray-800 pt-2 font-bold text-xl text-blue-900">
                            <span>Total:</span> <span id="view-total">0.00</span>
                        </div>
                        <div id="view-detraccion-box" class="hidden text-red-600 border-t border-dashed pt-2">
                            <div class="flex justify-between text-xs font-bold italic">
                                <span>Detracción:</span> <span id="view-detraccion">0.00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://cotizador-render-supabase.onrender.com/"; // CAMBIAR POR TU URL REAL
        let rowCount = 0;
        window.catalogoItems = [];

        window.onload = async () => {
            await cargarCatalogos();
            addRow(); // Iniciar con una fila vacía
        };

        async function cargarCatalogos() {
            try {
                const res = await fetch(`${API_URL}/catalogos`);
                const cat = await res.json();

                // Llenar Clientes
                const selectCliente = document.getElementById('cliente');
                selectCliente.innerHTML = '<option value="">Seleccione Cliente...</option>';
                cat.clientes.forEach(c => {
                    let opt = new Option(c.razon_social, c.id);
                    opt.setAttribute('data-ruc', c.ruc);
                    selectCliente.add(opt);
                });

                // Llenar Vendedores
                const selectVen = document.getElementById('vendedor');
                selectVen.innerHTML = '<option value="">Seleccione Vendedor...</option>';
                cat.vendedores.forEach(v => selectVen.add(new Option(v.nombre, v.id)));

                // Llenar Condiciones
                const selectCond = document.getElementById('condicion');
                selectCond.innerHTML = '<option value="">Seleccione Pago...</option>';
                cat.condiciones.forEach(cp => {
                    let opt = new Option(cp.descripcion, cp.id);
                    opt.setAttribute('data-dias', cp.dias);
                    selectCond.add(opt);
                });

                // Llenar Detracciones
                const selectDet = document.getElementById('tipoDetraccion');
                selectDet.innerHTML = '';
                cat.detracciones.forEach(d => selectDet.add(new Option(`${d.nombre} (${d.porcentaje}%)`, d.porcentaje)));

                window.catalogoItems = cat.items;
            } catch (error) {
                console.error("Error cargando catálogos:", error);
                alert("Error al conectar con el servidor de catálogos.");
            }
        }

        function addRow() {
            rowCount++;
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.id = `row-${rowCount}`;
            row.className = "flex gap-2 bg-gray-50 p-2 rounded-md border border-gray-200 items-center";
            
            let opcionesItems = window.catalogoItems.map(i => 
                `<option value="${i.id}" data-precio="${i.precio_unitario}" data-desc="${i.descripcion}">${i.codigo} - ${i.descripcion}</option>`
            ).join('');

            row.innerHTML = `
                <select class="flex-1 p-1 text-sm border rounded bg-white" onchange="seleccionarItem(${rowCount}, this)">
                    <option value="">Seleccione Ítem...</option>
                    ${opcionesItems}
                </select>
                <input type="number" placeholder="Cant" class="w-16 p-1 text-sm border rounded" value="1" oninput="calculateTotals()">
                <input type="number" placeholder="Precio" class="w-24 p-1 text-sm border rounded" oninput="calculateTotals()">
                <button onclick="removeRow(${rowCount})" class="text-red-500 font-bold px-2">×</button>
            `;
            container.appendChild(row);
        }

        function seleccionarItem(id, select) {
            const row = document.getElementById(`row-${id}`);
            const selectedOpt = select.options[select.selectedIndex];
            const precio = selectedOpt.getAttribute('data-precio');
            row.children[2].value = precio;
            calculateTotals();
        }

        function removeRow(id) {
            document.getElementById(`row-${id}`).remove();
            calculateTotals();
        }

        function calculateTotals() {
            let subtotal = 0;
            const rows = document.querySelectorAll('#items-container > div');
            const moneda = document.getElementById('moneda').value;
            const symbol = moneda === 'PEN' ? 'S/ ' : '$ ';
            
            let previewRows = "";

            rows.forEach(row => {
                const select = row.children[0];
                const desc = select.options[select.selectedIndex]?.text || "Seleccione un ítem";
                const qty = parseFloat(row.children[1].value) || 0;
                const price = parseFloat(row.children[2].value) || 0;
                const lineTotal = qty * price;
                subtotal += lineTotal;

                if (select.value !== "") {
                    previewRows += `
                        <tr class="border-b text-xs text-gray-700">
                            <td class="p-2 font-medium">${desc}</td>
                            <td class="p-2 text-center">${qty}</td>
                            <td class="p-2 text-right">${price.toFixed(2)}</td>
                            <td class="p-2 text-right font-bold">${lineTotal.toFixed(2)}</td>
                        </tr>
                    `;
                }
            });

            const igv = subtotal * 0.18;
            const total = subtotal + igv;
            
            const aplicaDet = document.getElementById('aplicaDetraccion').checked;
            const percDet = parseFloat(document.getElementById('tipoDetraccion').value);
            const valDet = total * (percDet / 100);

            document.getElementById('view-items').innerHTML = previewRows;
            document.getElementById('view-subtotal').innerText = symbol + subtotal.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('view-igv').innerText = symbol + igv.toLocaleString('en-US', {minimumFractionDigits: 2});
            document.getElementById('view-total').innerText = symbol + total.toLocaleString('en-US', {minimumFractionDigits: 2});
            
            const detBox = document.getElementById('view-detraccion-box');
            if(aplicaDet && total > 700 && moneda === 'PEN') {
                detBox.classList.remove('hidden');
                document.getElementById('view-detraccion').innerText = symbol + valDet.toFixed(2);
            } else {
                detBox.classList.add('hidden');
            }
            updatePreview();
        }

        function updatePreview() {
            const clienteSelect = document.getElementById('cliente');
            const vdorSelect = document.getElementById('vendedor');
            
            document.getElementById('view-cliente').innerText = clienteSelect.options[clienteSelect.selectedIndex]?.text || "-";
            document.getElementById('view-ruc').innerText = "RUC: " + (clienteSelect.options[clienteSelect.selectedIndex]?.getAttribute('data-ruc') || '-');
            document.getElementById('view-vendedor').innerText = vdorSelect.options[vdorSelect.selectedIndex]?.text || "-";
            document.getElementById('view-fecha').innerText = new Date().toLocaleDateString('es-PE');
        }

        async function guardarCotizacion() {
            // Lógica para recolectar y enviar a backend (Paso siguiente)
            alert("Listo para enviar a la base de datos de Supabase.");
        }
    </script>
</body>
</html>
