<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador SAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-xl font-bold mb-4">Generar Cotización</h1>
        
        <input type="text" id="cliente" placeholder="Nombre del Cliente" class="w-full mb-2 p-2 border">
        <input type="number" id="monto" placeholder="Monto Total" class="w-full mb-4 p-2 border">
        
        <button onclick="guardarCotizacion()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
            Guardar en la Nube
        </button>
    </div>

    <script>
        // Esta es la función que ya tenías, pero integrada en el HTML
        async function guardarCotizacion() {
            const data = {
                cliente: document.getElementById('cliente').value,
                monto: document.getElementById('monto').value
            };

            // Asegúrate de que esta URL sea la que te dio Render para tu Web Service (Backend)
            const URL_BACKEND = "https://api-cotizador.onrender.com/cotizar";

            try {
                const response = await fetch(URL_BACKEND, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("¡Cotización enviada al servidor con éxito!");
                } else {
                    alert("Error en el servidor");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("No se pudo conectar con el servidor");
            }
        }
    </script>
</body>
</html>
